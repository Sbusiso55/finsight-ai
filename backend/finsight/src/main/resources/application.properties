spring.application.name=finsight

# Database Configuration
# Each person sets DB_URL, DB_USERNAME and DB_PASSWORD on their own laptop.
# If DB_URL is not set, it falls back to the production address,
# which still needs the production password (only Kevin has it).
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-broad-wave-b905djqv-pooler.c-7.eu-central-1.aws.neon.tech:5432/finsightdb?sslmode=require}
spring.datasource.username=${DB_USERNAME:finsightdb_owner}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG
logging.level.com.finsight=DEBUG

server.port=8080
jwt.secret=${JWT_SECRET}